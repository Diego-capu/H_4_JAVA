<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Aplicación Integral</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">
        <h1>Gestor de Productos / Tareas</h1>

        <div id="message-container"></div>

        <form id="main-form">
            <div class="form-group">
                <label for="item-name">Nombre:</label>
                <input type="text" id="item-name" placeholder="Ej. Comprar leche">
            </div>
            <div class="form-group">
                <label for="item-value">Precio / Descripción:</label>
                <input type="number" id="item-value" placeholder="Ej. 1500" min="0">
            </div>
            <button type="submit" id="btn-save" class="btn-primary">Guardar Elemento</button>
        </form>

        <hr>

        <h2>Lista de Elementos</h2>
        <ul id="items-list">
        </ul>

        <div class="actions">
            <h3>Sincronización con Servidor</h3>
            <div class="action-buttons">
                <button id="btn-fetch-get" class="btn-secondary">Cargar de la API (GET)</button>
                <button id="btn-api-sync" class="btn-secondary">Sincronizar Todo (POST/PUT)</button>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>

</html>
