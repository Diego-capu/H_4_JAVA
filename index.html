<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Aplicación Integral</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; max-width: 600px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { padding: 10px 15px; cursor: pointer; margin-right: 5px; }
        ul { list-style-type: none; padding: 0; }
        li { background: #cf0e0e; margin: 5px 0; padding: 10px; display: flex; justify-content: space-between; align-items: center; border-radius: 4px; }
        .error { color: red; margin-bottom: 15px; }
        .success { color: green; margin-bottom: 15px; }
        .btn-delete { background-color: #ff4d4d; color: white; border: none; padding: 5px 10px; border-radius: 3px; }
        .actions { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 15px; }
        .background-color {color:blueviolet}
    </style>
</head>
<body>

    <h1>Gestor de Productos / Tareas</h1>

    <div id="message-container"></div>

    <form id="main-form">
        <div class="form-group">
            <label for="item-name">Nombre:</label>
            <input type="text" id="item-name" placeholder="Ej. Comprar leche ">
        </div>
        <div class="form-group">
            <label for="item-value">Precio / Descripción:</label>
            <input type="number" id="item-value" placeholder="Ej. 1500 o Prioridad Alta" min="0">
        </div>
        <button type="submit" id="btn-save">Guardar Elemento</button>
    </form>

    <hr>

    <h2>Lista de Elementos</h2>
    <ul id="items-list">

    </ul>

    <div class="actions">
        <h3>Sincronización con Servidor</h3>
        <button id="btn-fetch-get">Cargar de la API (GET)</button>
        <button id="btn-api-sync">Sincronizar Todo (POST/PUT)</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
